<div class="app-shell">
  <header class="app-header">
    <div class="header-inner">
      <a routerLink="/home" class="brand" aria-label="WebNet Builder home">
        <img ngSrc="assets/imgs/webnet-nav-logo.png" alt="" height="40" width="60" class="brand-logo">
        <span class="brand-text">
          <span class="brand-name">WebNet</span>
          <span class="brand-tag">Builder</span>
        </span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a class="nav-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
          <mat-icon>home</mat-icon>
          <span>Home</span>
        </a>
        <a class="nav-link" routerLink="/playground" routerLinkActive="active">
          <mat-icon>hub</mat-icon>
          <span>Playground</span>
        </a>
        <a class="nav-link" routerLink="/projects" routerLinkActive="active"
           [matBadge]="getNumberOfProjects() || null" matBadgeColor="accent" matBadgeSize="small">
          <mat-icon>folder_open</mat-icon>
          <span>Projects</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
